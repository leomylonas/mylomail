<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description" font-family="IBM Plex Sans, Arial, sans-serif">
<title id="title">Native desktop and menu-bar icon treatments</title>
<desc id="description">The desktop launcher uses the approved blue and dark mark on a white rounded backplate in both themes. The macOS menu-bar template uses a monochrome mark with system-selected contrast.</desc>
<rect x="0" y="0" width="468" height="360" fill="#f4f4f4" stroke="#e0e0e0" /><text x="24" y="36" font-size="24" fill="#161616" font-weight="600">Light desktop</text><svg x="32" y="88" width="144" height="144" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#ffffff" /><svg x="40" y="40" width="432" height="432" viewBox="30 30 100 100"><g transform="translate(30 31)"><path fill="#161616" d="M10 80V24Q10 18 16 18H25L46 44V80Z" /><path fill="#0f62fe" d="M54 80V44L75 18H84Q90 18 90 24V80Z" /></g></svg></svg><text x="32" y="266" font-size="18" fill="#161616" font-weight="600">Desktop launcher</text><text x="32" y="294" font-size="16" fill="#525252" font-weight="400">Neutral backplate</text><rect x="220" y="124" width="224" height="56" fill="#ffffff" stroke="none" /><svg x="232" y="136" width="32" height="32" viewBox="30 30 100 100"><g transform="translate(30 31)"><path fill="#161616" d="M10 80V24Q10 18 16 18H25L46 44V80Z" /><path fill="#161616" d="M54 80V44L75 18H84Q90 18 90 24V80Z" /></g></svg><text x="280" y="158" font-size="17" fill="#161616" font-weight="400">Menu bar</text><text x="220" y="266" font-size="18" fill="#161616" font-weight="600">macOS template</text><text x="220" y="294" font-size="16" fill="#525252" font-weight="400">System-chosen contrast</text><rect x="492" y="0" width="468" height="360" fill="#161616" stroke="#393939" /><text x="516" y="36" font-size="24" fill="#f4f4f4" font-weight="600">Dark desktop</text><svg x="524" y="88" width="144" height="144" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#ffffff" /><svg x="40" y="40" width="432" height="432" viewBox="30 30 100 100"><g transform="translate(30 31)"><path fill="#161616" d="M10 80V24Q10 18 16 18H25L46 44V80Z" /><path fill="#0f62fe" d="M54 80V44L75 18H84Q90 18 90 24V80Z" /></g></svg></svg><text x="524" y="266" font-size="18" fill="#f4f4f4" font-weight="600">Desktop launcher</text><text x="524" y="294" font-size="16" fill="#c6c6c6" font-weight="400">Neutral backplate</text><rect x="712" y="124" width="224" height="56" fill="#262626" stroke="none" /><svg x="724" y="136" width="32" height="32" viewBox="30 30 100 100"><g transform="translate(30 31)"><path fill="#f4f4f4" d="M10 80V24Q10 18 16 18H25L46 44V80Z" /><path fill="#f4f4f4" d="M54 80V44L75 18H84Q90 18 90 24V80Z" /></g></svg><text x="772" y="158" font-size="17" fill="#f4f4f4" font-weight="400">Menu bar</text><text x="712" y="266" font-size="18" fill="#f4f4f4" font-weight="600">macOS template</text><text x="712" y="294" font-size="16" fill="#c6c6c6" font-weight="400">System-chosen contrast</text>
</svg>
