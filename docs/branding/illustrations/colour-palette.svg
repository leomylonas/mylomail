<svg xmlns="http://www.w3.org/2000/svg" width="960" height="364" viewBox="0 0 960 364" role="img" aria-labelledby="title description" font-family="IBM Plex Sans, Arial, sans-serif">
<title id="title">The light and dark brand palettes</title>
<desc id="description">Six swatches per theme show background, primary text, secondary text, primary blue, raised surface, and subtle border. Primary blue is identical in both rows. Exact values are listed in the guide.</desc>
<rect x="0" y="0" width="960" height="176" fill="#ffffff" stroke="#e0e0e0" /><text x="24" y="32" font-size="22" fill="#161616" font-weight="600">Light palette</text><rect x="24" y="52" width="132" height="68" fill="#ffffff" stroke="#c6c6c6" /><text x="24" y="148" font-size="16" fill="#161616" font-weight="400">Background</text><rect x="180" y="52" width="132" height="68" fill="#161616" stroke="#c6c6c6" /><text x="180" y="148" font-size="16" fill="#161616" font-weight="400">Primary text</text><rect x="336" y="52" width="132" height="68" fill="#525252" stroke="#c6c6c6" /><text x="336" y="148" font-size="16" fill="#161616" font-weight="400">Secondary text</text><rect x="492" y="52" width="132" height="68" fill="#0f62fe" stroke="#c6c6c6" /><text x="492" y="148" font-size="16" fill="#161616" font-weight="400">Primary blue</text><rect x="648" y="52" width="132" height="68" fill="#f4f4f4" stroke="#c6c6c6" /><text x="648" y="148" font-size="16" fill="#161616" font-weight="400">Raised surface</text><rect x="804" y="52" width="132" height="68" fill="#e0e0e0" stroke="#c6c6c6" /><text x="804" y="148" font-size="16" fill="#161616" font-weight="400">Subtle border</text><rect x="0" y="188" width="960" height="176" fill="#161616" stroke="#393939" /><text x="24" y="220" font-size="22" fill="#f4f4f4" font-weight="600">Dark palette</text><rect x="24" y="240" width="132" height="68" fill="#161616" stroke="#525252" /><text x="24" y="336" font-size="16" fill="#f4f4f4" font-weight="400">Background</text><rect x="180" y="240" width="132" height="68" fill="#f4f4f4" stroke="#525252" /><text x="180" y="336" font-size="16" fill="#f4f4f4" font-weight="400">Primary text</text><rect x="336" y="240" width="132" height="68" fill="#c6c6c6" stroke="#525252" /><text x="336" y="336" font-size="16" fill="#f4f4f4" font-weight="400">Secondary text</text><rect x="492" y="240" width="132" height="68" fill="#0f62fe" stroke="#525252" /><text x="492" y="336" font-size="16" fill="#f4f4f4" font-weight="400">Primary blue</text><rect x="648" y="240" width="132" height="68" fill="#262626" stroke="#525252" /><text x="648" y="336" font-size="16" fill="#f4f4f4" font-weight="400">Raised surface</text><rect x="804" y="240" width="132" height="68" fill="#393939" stroke="#525252" /><text x="804" y="336" font-size="16" fill="#f4f4f4" font-weight="400">Subtle border</text>
</svg>
