!include Base.conf

# Tier 3 — neither CONDSTORE nor QRESYNC, and no UIDPLUS or MOVE either. Flags come from a
# cadenced scan over known UIDs, expunges from UID-set reconciliation, and a move cannot
# report its destination UID, so the provider must report
# ReportsDestinationIdOnMove = false and flag destination reconciliation (§2, §3).
namespace inbox {
  separator = /
}

protocol imap {
  imap_capability = IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE SORT THREAD=REFERENCES MULTIAPPEND UNSELECT CHILDREN NAMESPACE LIST-EXTENDED I18NLEVEL=1 ESEARCH ESORT SEARCHRES WITHIN CONTEXT=SEARCH LIST-STATUS BINARY SPECIAL-USE
}
