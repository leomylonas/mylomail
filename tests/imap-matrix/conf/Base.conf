# Shared base for every tier. Test-only: plaintext auth on loopback, one static user, no
# TLS. Never a template for anything reachable from a network.
protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_location = maildir:/srv/mail/%u
mail_home = /srv/mail/%u

# CONDSTORE and QRESYNC need per-mailbox index state to report mod-sequences at all.
mail_plugins = $mail_plugins

passdb {
  driver = static
  args = password=password allow_nets=0.0.0.0/0
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

# Auto-create the special-use mailboxes a provider expects to find (§1).
namespace inbox {
  inbox = yes

  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}
