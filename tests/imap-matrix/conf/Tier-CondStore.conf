!include Base.conf

# Tier 2 — CONDSTORE without QRESYNC. Flag changes come via CHANGEDSINCE, but expunges
# still require UID-set reconciliation (§3).
#
# The advertised capability list is what a client negotiates on, so removing QRESYNC here
# is what makes this a genuine tier-2 server from the provider's point of view. The
# underlying server remains capable; see the caveat in the README.
namespace inbox {
  # Deliberately not "/" — the hierarchy delimiter is server-declared and must never be
  # assumed (§1). A provider that hardcodes "/" fails against this tier and passes the
  # others, which is the entire point of running the matrix.
  separator = .
  prefix = INBOX.
}

protocol imap {
  imap_capability = IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE SORT SORT=DISPLAY THREAD=REFERENCES THREAD=REFS MULTIAPPEND UNSELECT CHILDREN NAMESPACE UIDPLUS LIST-EXTENDED I18NLEVEL=1 CONDSTORE ESEARCH ESORT SEARCHRES WITHIN CONTEXT=SEARCH LIST-STATUS BINARY MOVE SPECIAL-USE
}
