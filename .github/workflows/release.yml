name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "testing"
      - "testing-*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare unpacked application
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm package:dir
      - name: Build AppImage
        if: runner.os == 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm exec electron-builder --config ElectronBuilder.yml --publish never --linux AppImage --x64
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm exec electron-builder --config ElectronBuilder.yml --publish never --linux deb --x64
      - name: Build RPM package
        if: runner.os == 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm exec electron-builder --config ElectronBuilder.yml --publish never --linux rpm --x64
      - name: Build NSIS installer
        if: runner.os == 'Windows'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm exec electron-builder --config ElectronBuilder.yml --publish never --win nsis --x64
      - name: Build MSI installer
        if: runner.os == 'Windows'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm exec electron-builder --config ElectronBuilder.yml --publish never --win msi --x64
      - name: Build DMG image
        if: runner.os == 'macOS'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm exec electron-builder --config ElectronBuilder.yml --publish never --mac dmg --arm64
      - name: Build macOS ZIP
        if: runner.os == 'macOS'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm exec electron-builder --config ElectronBuilder.yml --publish never --mac zip --arm64
      - run: pnpm exec tsx scripts/RunCICommand.ts pnpm package:verify-artifacts
      - name: Verify native attachment opening
        if: runner.os != 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm exec playwright test --config tests/renderer.e2e/Native.Playwright.config.ts
      - name: Smoke packaged application
        if: runner.os != 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm exec playwright test --config tests/renderer.e2e/Packaged.Playwright.config.ts
      - name: Smoke packaged application
        if: runner.os == 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts xvfb-run --auto-servernum pnpm exec playwright test --config tests/renderer.e2e/Packaged.Playwright.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.label }}
          if-no-files-found: error
          path: |
            dist/packages/*.AppImage
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/*.exe
            dist/packages/*.msi
            dist/packages/*.dmg
            dist/packages/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum packages/* > packages/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: packages/*
