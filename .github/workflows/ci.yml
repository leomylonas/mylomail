name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: dotnet tool restore
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:types
      - run: pnpm check

  cross-platform-check:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: dotnet tool restore
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:types
      - name: Verify complete suite
        if: runner.os == 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm check
      - name: Verify portable build and tests
        if: runner.os != 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm check:platform
      - name: Verify native credential store
        if: runner.os != 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm check:native-credentials
        env:
          MYLOMAIL_TEST_NATIVE_CREDENTIAL_STORE: "1"
