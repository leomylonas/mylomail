name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: dotnet tool restore
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:types
      - name: Verify generated types are committed
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- packages/shared-types/src)"
      - run: pnpm build:electron
      # An independent PST reader (libpst), so the PST export is checked by more than the library that wrote it.
      - run: sudo apt-get update && sudo apt-get install -y pst-utils
      - run: pnpm check
        env:
          MYLOMAIL_REQUIRE_READPST: "1"

  # The PST export is the one feature whose output a second program has to accept, and file handling
  # (atomic commit, working files) differs per OS. Only the PST tests run here, with libpst's readpst
  # installed as the independent reader; the rest of the suite stays on Linux above.
  pst-windows:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-libpst
      - name: Put readpst on the path
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin" >> "$GITHUB_PATH"
      - name: PST export tests
        shell: bash
        env:
          MYLOMAIL_REQUIRE_READPST: "1"
        run: dotnet test server/MyloMail.Api.Tests --filter "FullyQualifiedName~Pst"

  pst-macos:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: brew install libpst
      - name: PST export tests
        env:
          MYLOMAIL_REQUIRE_READPST: "1"
        run: dotnet test server/MyloMail.Api.Tests --filter "FullyQualifiedName~Pst"

  cross-platform-check:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: dotnet tool restore
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:types
      - name: Verify generated types are committed
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- packages/shared-types/src)"
      - name: Verify complete suite
        if: runner.os == 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm check
      - name: Verify portable build and tests
        if: runner.os != 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm check:platform
      - name: Verify native credential store
        if: runner.os != 'Linux'
        run: pnpm exec tsx scripts/RunCICommand.ts pnpm check:native-credentials
        env:
          MYLOMAIL_TEST_NATIVE_CREDENTIAL_STORE: "1"
