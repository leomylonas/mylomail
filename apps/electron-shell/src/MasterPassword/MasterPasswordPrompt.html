<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
		/>
		<title>MyloMail</title>
		<style>
			body {
				margin: 0;
				padding: 1.5rem;
				font:
					14px system-ui,
					sans-serif;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
			}
			h1 {
				margin: 0;
				font-size: 1rem;
			}
			p {
				margin: 0;
				color: #555;
			}
			input,
			button {
				font: inherit;
				padding: 0.5rem;
			}
			.actions {
				display: flex;
				gap: 0.5rem;
				justify-content: flex-end;
			}
		</style>
	</head>
	<body>
		<h1 id="title">Set a master password</h1>
		<p id="explanation"></p>
		<label for="password">Master password</label>
		<input id="password" type="password" autofocus />
		<div class="actions">
			<button id="cancel" type="button">Quit</button>
			<button id="submit" type="button">Continue</button>
		</div>
		<script>
			// No OS credential store is available, so this password is what protects stored
			// account credentials. It is sent once to the backend for this launch and never
			// written to disk.
			const setup = !location.search.includes("unlock");
			document.getElementById("title").textContent = setup
				? "Set a master password"
				: "Unlock MyloMail";
			document.getElementById("explanation").textContent = setup
				? "This device has no system keychain available, so MyloMail encrypts your account credentials with a password you choose. It is never stored. This is weaker and less convenient than an OS keychain — MyloMail cannot start until you re-enter this password each launch, so background sync, notifications, and scheduled sends cannot run until then. Enabling your system's keychain (e.g. installing and running a Secret Service provider on Linux) removes this requirement."
				: "Enter your master password to unlock your account credentials.";

			const field = document.getElementById("password");
			const send = () => {
				if (field.value) window.masterPassword.submit(field.value);
			};
			document.getElementById("submit").addEventListener("click", send);
			field.addEventListener("keydown", (event) => {
				if (event.key === "Enter") send();
			});
			document
				.getElementById("cancel")
				.addEventListener("click", () => window.masterPassword.cancel());
		</script>
	</body>
</html>
