<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>MyloMail</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #ffffff;
				color: #161616;
				font-family:
					"IBM Plex Sans",
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #161616;
					color: #f4f4f4;
				}
				.mark {
					color: #f4f4f4;
				}
			}
			main {
				max-width: 26rem;
				padding: 2rem;
				text-align: center;
			}
			.mark {
				color: #161616;
			}
			h1 {
				margin: 1.5rem 0 0.75rem;
				font-size: 1.75rem;
				font-weight: 400;
			}
			p {
				margin: 0;
				line-height: 1.5;
				color: #525252;
			}
			@media (prefers-color-scheme: dark) {
				p {
					color: #c6c6c6;
				}
			}
			.rule {
				margin: 2rem auto 0;
				width: 3rem;
				height: 3px;
				background: #0f62fe;
			}
		</style>
	</head>
	<body>
		<main>
			<svg
				class="mark"
				xmlns="http://www.w3.org/2000/svg"
				viewBox="10 18 80 62"
				width="72"
				height="56"
				role="img"
				aria-label="MyloMail"
			>
				<path fill="currentColor" d="M10 80V24Q10 18 16 18H25L46 44V80Z" />
				<path fill="#0f62fe" d="M54 80V44L75 18H84Q90 18 90 24V80Z" />
			</svg>
			<h1>@@HEADING@@</h1>
			<p>@@BODY@@</p>
			<div class="rule"></div>
		</main>
	</body>
</html>
